apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: taskflow
data:
  NODE_ENV: production
  APP_ENV: kubernetes-lab
  HOST: 0.0.0.0
  PORT: '3000'
  DB_HOST: db
  DB_PORT: '5432'
  DB_PASSWORD_FILE: /run/secrets/db/password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: api
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/component: api
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      containers:
      - name: api
        image: nicolasbellina/taskflow-api:1.0.0
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: POSTGRES_DB
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: POSTGRES_USER
        envFrom:
        - configMapRef:
            name: api-config
        volumeMounts:
        - name: db-credentials
          mountPath: /run/secrets/db
          readOnly: true
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 6
          failureThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
      volumes:
      - name: db-credentials
        secret:
          secretName: db-credentials
          defaultMode: 292
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: api
  ports:
  - name: http
    port: 3000
    targetPort: http
