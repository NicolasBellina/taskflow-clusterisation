apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: taskflow
data:
  POSTGRES_DB: taskflow
  POSTGRES_USER: taskflow
  POSTGRES_PASSWORD_FILE: /run/secrets/db/password
  PGDATA: /var/lib/postgresql/data/pgdata
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/component: database
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        ports:
        - name: postgres
          containerPort: 5432
        envFrom:
        - configMapRef:
            name: db-config
        volumeMounts:
        - name: db-credentials
          mountPath: /run/secrets/db
          readOnly: true
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          timeoutSeconds: 3
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          timeoutSeconds: 3
          periodSeconds: 5
          failureThreshold: 2
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: db-credentials
        secret:
          secretName: db-credentials
          defaultMode: 292
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: database
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
