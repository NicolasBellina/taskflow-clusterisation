apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: front
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow
      app.kubernetes.io/component: front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/component: front
    spec:
      containers:
        - name: front
          image: nicolasbellina/taskflow-front:1.0.0
          # L'image 1.0.0 utilise le DNS Docker : remplacer son adresse par
          # celle fournie au Pod par Kubernetes, puis démarrer Nginx.
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              dns_resolver="$(awk '/^nameserver / { print $2; exit }' /etc/resolv.conf)"
              test -n "$dns_resolver"
              sed -i "s/resolver 127.0.0.11 /resolver $dns_resolver /" /etc/nginx/conf.d/default.conf
              # Le resolver Nginx n'applique pas les suffixes search de resolv.conf.
              sed -i 's@http://api:3000@http://api.taskflow.svc.cluster.local:3000@' /etc/nginx/conf.d/default.conf
              exec /docker-entrypoint.sh nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: front
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: front
  ports:
    - name: http
      # 80 et 443 sont réservés à Traefik sur la VM k3s du cours.
      port: 32000
      targetPort: http
