apiVersion: v1
kind: ConfigMap
metadata:
  name: front-config
  namespace: taskflow
data:
  API_HOST: api.taskflow.svc.cluster.local:3000
  nginx.conf.template: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # DNS du cluster : l'adresse de l'API peut changer après une recréation.
        resolver $DNS_RESOLVER valid=10s ipv6=off;
        set $api_backend http://$API_HOST;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            # $request_uri conserve le préfixe /api et les paramètres.
            proxy_pass $api_backend$request_uri;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
  start.sh: |
    set -eu
    DNS_RESOLVER="$(awk '/^nameserver / { print $2; exit }' /etc/resolv.conf)"
    export DNS_RESOLVER
    test -n "$DNS_RESOLVER"
    envsubst '$DNS_RESOLVER $API_HOST' < /etc/taskflow/nginx.conf.template > /etc/nginx/conf.d/default.conf
    exec /docker-entrypoint.sh nginx -g 'daemon off;'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: front
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow
      app.kubernetes.io/component: front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/component: front
    spec:
      containers:
      - name: front
        image: nicolasbellina/taskflow-front:1.0.0
        command:
        - /bin/sh
        - /etc/taskflow/start.sh
        ports:
        - name: http
          containerPort: 80
        env:
        - name: API_HOST
          valueFrom:
            configMapKeyRef:
              name: front-config
              key: API_HOST
        volumeMounts:
        - name: front-config
          mountPath: /etc/taskflow
          readOnly: true
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 15
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
      volumes:
      - name: front-config
        configMap:
          name: front-config
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: front
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: front
  ports:
  - name: http
    port: 32000
    targetPort: http
